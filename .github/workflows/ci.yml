name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Some CLI tests exercise the real store path, and the store's
      # integration tests below deliberately fail loud if the CLI is absent.
      # Install DuckDB before any Go test step so unit and integration tests
      # see the same runtime dependency.
      # Pinned tarball, not install.duckdb.org: that script is bash and CI's
      # `sh` is dash, so its `[[` test failed, arch detection fell through, and
      # the download 404'd -- CI went red on an upstream script change with no
      # commit here to blame. A pinned asset also keeps CI on the same DuckDB
      # the store is developed against instead of silently tracking latest.
      - name: Install DuckDB CLI
        env:
          DUCKDB_VERSION: v1.5.5
        run: |
          curl -fsSL -o /tmp/duckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          # unzip -d creates only the final directory, and the runner has no
          # ~/.local at all, so the parents have to exist first.
          mkdir -p "$HOME/.local/bin"
          unzip -o -d "$HOME/.local/bin" /tmp/duckdb.zip
          chmod +x "$HOME/.local/bin/duckdb"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: duckdb --version
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1
      # The dispatcher is one goroutine plus N workers sharing a
      # deliberately lock-free dispatchState, whose safety rests on
      # "only the dispatch goroutine touches it". The race detector is
      # what polices that; without this step the invariant is a comment.
      - run: go test ./internal/scheduler/ ./internal/cli/ -count=1 -race
      # The store's DuckDB round-trips (hold-upsert CASE, Promote, queue
      # ordering) only run under the integration tag and self-skip without
      # the duckdb CLI; the version check above keeps that dependency loud
      # so the queue's most intricate SQL is actually exercised in CI. Only
      # the store package runs here: review/discover
      # integration tests need codex/gh auth, which CI doesn't have.
      - run: go test ./internal/store/ -count=1 -tags=integration
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  # The dashboard is a Vite build whose OUTPUT is committed (go:embed ships
  # it; the release workflow only runs `go build`). Rebuild and diff so a UI
  # source change can't land with a stale committed bundle. Works because
  # Vite's filenames are content-hashed and npm ci pins deps via the lockfile,
  # so rebuilding unchanged source is byte-identical.
  dashboard-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/dashboard/ui/package-lock.json
      - run: npm ci --prefix internal/dashboard/ui
      - run: npm test --prefix internal/dashboard/ui
      - run: npm run build --prefix internal/dashboard/ui
      - run: git diff --exit-code -- internal/dashboard/assets
